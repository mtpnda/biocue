<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioCue Design Language - Login & Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#141E33', 900: '#0F172A' },
                        calm: { 400: '#38BDF8', 500: '#0EA5E9', 900: '#0C4A6E' },
                        surface: { default: 'rgba(255, 255, 255, 0.05)', hover: 'rgba(255, 255, 255, 0.1)' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0F172A; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .ambient-glow { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; z-index: -1; }
        .gradient-text { background: linear-gradient(135deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AmbientBackground = () => (
            <div className="fixed inset-0 overflow-hidden pointer-events-none">
                <div className="ambient-glow bg-blue-500 w-[500px] h-[500px] -top-[200px] -left-[100px]"></div>
                <div className="ambient-glow bg-emerald-500 w-[600px] h-[600px] bottom-[100px] -right-[200px]"></div>
                <div className="ambient-glow bg-indigo-500 w-[400px] h-[400px] top-[40%] left-[20%]"></div>
            </div>
        );

        const ScreenContainer = ({ children }) => (
            <div className="relative w-[390px] h-[844px] bg-slate-900 rounded-[40px] overflow-hidden shadow-2xl border-8 border-gray-800 m-8 inline-block align-top">
                {children}
            </div>
        );

        const LoginScreen = () => {
            return (
                <ScreenContainer>
                    <div className="flex flex-col h-full p-8 relative z-10">
                        <div className="flex-1 flex flex-col justify-center items-center text-center">
                            <div className="w-24 h-24 rounded-3xl glass-panel flex items-center justify-center mb-8">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-calm-400">
                                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                                </svg>
                            </div>
                            <h1 className="text-4xl font-semibold mb-3 gradient-text">BioCue</h1>
                            <p className="text-slate-400 text-sm max-w-[200px] leading-relaxed">Find your center. <br/>Stay connected.</p>
                        </div>

                        <div className="w-full space-y-4 pb-8">
                            <button className="w-full py-4 rounded-2xl glass-panel text-white font-medium flex items-center justify-center space-x-3 hover:bg-surface-hover transition-colors">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path d="M9 12l2 2 4-4"></path></svg>
                                <span>Continue with Google</span>
                            </button>
                            
                            <div className="relative flex items-center py-2">
                                <div className="flex-grow border-t border-slate-700/50"></div>
                                <span className="flex-shrink-0 mx-4 text-xs text-slate-500 uppercase tracking-wider">or sign in</span>
                                <div className="flex-grow border-t border-slate-700/50"></div>
                            </div>

                            <div className="space-y-3">
                                <input type="email" placeholder="Email address" className="w-full bg-black/20 border border-white/5 rounded-2xl px-5 py-4 text-white placeholder:text-slate-500 focus:outline-none focus:border-calm-500/50 transition-colors" />
                                <input type="password" placeholder="Password" className="w-full bg-black/20 border border-white/5 rounded-2xl px-5 py-4 text-white placeholder:text-slate-500 focus:outline-none focus:border-calm-500/50 transition-colors" />
                            </div>

                            <button className="w-full py-4 rounded-2xl bg-calm-500 text-white font-medium hover:bg-calm-400 transition-colors shadow-[0_0_20px_rgba(14,165,233,0.3)]">
                                Sign In
                            </button>
                            
                            <p className="text-center text-xs text-slate-500 pt-4">
                                By continuing, you agree to our <a href="#" className="text-slate-300 underline">Terms</a> & <a href="#" className="text-slate-300 underline">Privacy</a>.
                            </p>
                        </div>
                    </div>
                </ScreenContainer>
            );
        };

        const ProfileScreen = () => {
            const [language, setLanguage] = useState('en');
            const [dropdownOpen, setDropdownOpen] = useState(false);

            return (
                <ScreenContainer>
                    <div className="flex flex-col h-full relative z-10">
                        {/* Header */}
                        <div className="flex items-center px-6 pt-12 pb-6">
                            <button className="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:bg-surface-hover">
                                <i data-lucide="arrow-left" className="w-5 h-5 text-slate-300"></i>
                            </button>
                            <h2 className="ml-4 text-xl font-medium">Profile</h2>
                        </div>

                        <div className="px-6 flex-1 overflow-y-auto pb-12 no-scrollbar">
                            
                            {/* User Card */}
                            <div className="glass-panel rounded-[24px] p-6 mb-8 relative overflow-hidden group">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-calm-500 to-emerald-400"></div>
                                <div className="flex items-center space-x-4">
                                    <div className="w-16 h-16 rounded-full bg-gradient-to-br from-slate-700 to-slate-800 flex items-center justify-center text-2xl font-medium border border-white/10 shadow-inner">
                                        JD
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-medium text-white mb-1">Jane Doe</h3>
                                        <div className="inline-flex items-center space-x-1.5 bg-calm-500/10 text-calm-400 px-2.5 py-1 rounded-full text-xs font-medium border border-calm-500/20">
                                            <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                                            <span>Caregiver Mode</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Settings List */}
                            <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-4 px-1">Settings</h4>
                            
                            <div className="glass-panel rounded-[24px] overflow-hidden mb-6">
                                
                                {/* Language Dropdown */}
                                <div className="relative">
                                    <button 
                                        onClick={() => setDropdownOpen(!dropdownOpen)}
                                        className="w-full flex items-center justify-between p-5 hover:bg-white/5 transition-colors"
                                    >
                                        <div className="flex items-center space-x-4">
                                            <div className="w-10 h-10 rounded-xl bg-slate-800/50 flex items-center justify-center text-slate-300 border border-white/5">
                                                <i data-lucide="globe" className="w-5 h-5"></i>
                                            </div>
                                            <div className="text-left">
                                                <div className="text-sm font-medium text-white">Language</div>
                                                <div className="text-xs text-slate-400 mt-0.5">{language === 'en' ? 'English' : 'Bahasa Indonesia'}</div>
                                            </div>
                                        </div>
                                        <i data-lucide="chevron-down" className={`w-5 h-5 text-slate-500 transition-transform ${dropdownOpen ? 'rotate-180' : ''}`}></i>
                                    </button>
                                    
                                    {dropdownOpen && (
                                        <div className="absolute top-full left-4 right-4 mt-2 bg-slate-800 border border-white/10 rounded-2xl shadow-xl overflow-hidden z-50 animate-in fade-in slide-in-from-top-2 duration-200">
                                            <button 
                                                onClick={() => { setLanguage('en'); setDropdownOpen(false); }}
                                                className="w-full text-left px-5 py-4 text-sm hover:bg-white/5 flex items-center justify-between"
                                            >
                                                <span>English</span>
                                                {language === 'en' && <i data-lucide="check" className="w-4 h-4 text-calm-400"></i>}
                                            </button>
                                            <div className="h-px w-full bg-white/5"></div>
                                            <button 
                                                onClick={() => { setLanguage('id'); setDropdownOpen(false); }}
                                                className="w-full text-left px-5 py-4 text-sm hover:bg-white/5 flex items-center justify-between"
                                            >
                                                <span>Bahasa Indonesia</span>
                                                {language === 'id' && <i data-lucide="check" className="w-4 h-4 text-calm-400"></i>}
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="h-px w-full bg-white/5 ml-16"></div>
                                
                                <button className="w-full flex items-center justify-between p-5 hover:bg-white/5 transition-colors">
                                    <div className="flex items-center space-x-4">
                                        <div className="w-10 h-10 rounded-xl bg-slate-800/50 flex items-center justify-center text-slate-300 border border-white/5">
                                            <i data-lucide="bell" className="w-5 h-5"></i>
                                        </div>
                                        <div className="text-left">
                                            <div className="text-sm font-medium text-white">Notifications</div>
                                        </div>
                                    </div>
                                    <i data-lucide="chevron-right" className="w-5 h-5 text-slate-500"></i>
                                </button>
                            </div>

                            <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-4 px-1">Account</h4>

                            <div className="glass-panel rounded-[24px] overflow-hidden">
                                <button className="w-full flex items-center p-5 hover:bg-red-500/10 transition-colors group">
                                    <div className="w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center text-red-400 border border-red-500/20 group-hover:bg-red-500/20">
                                        <i data-lucide="log-out" className="w-5 h-5"></i>
                                    </div>
                                    <span className="ml-4 text-sm font-medium text-red-400">Sign Out</span>
                                </button>
                            </div>

                        </div>
                    </div>
                </ScreenContainer>
            );
        };

        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            });
            return (
                <div className="min-h-screen p-12 flex justify-center items-center gap-12 flex-wrap">
                    <AmbientBackground />
                    <div>
                        <h2 className="text-center text-slate-400 mb-6 tracking-widest text-sm uppercase">Login / Sign In</h2>
                        <LoginScreen />
                    </div>
                    <div>
                        <h2 className="text-center text-slate-400 mb-6 tracking-widest text-sm uppercase">Profile / Settings</h2>
                        <ProfileScreen />
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
