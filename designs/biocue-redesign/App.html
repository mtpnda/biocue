<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioCue Prototype</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --bg: #0a0e1a;
            --surface: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --accent: #818cf8;
            --calm: #34d399;
            --warn: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        /* === WATCH === */
        .watch {
            width: 220px; height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #1e293b, #0f172a);
            border: 10px solid #334155;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }
        .anchor-btn {
            width: 110px; height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border: none; cursor: pointer;
            box-shadow: 0 4px 20px rgba(14,165,233,0.3);
            display: flex; justify-content: center; align-items: center;
            transition: all 0.5s ease;
        }
        .anchor-btn:active { transform: scale(0.92); }
        .anchor-btn.glowing {
            box-shadow: 0 0 30px rgba(129,140,248,0.6), 0 0 60px rgba(129,140,248,0.3);
        }
        .anchor-dot { width: 36px; height: 36px; border-radius: 50%; background: white; opacity: 0.9; }

        /* === PHONE === */
        .phone {
            width: 340px;
            min-height: 700px;
            background: linear-gradient(180deg, var(--bg), #111827);
            border-radius: 36px;
            border: 8px solid #334155;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            padding: 28px 18px;
            overflow-y: auto;
        }
        .phone::-webkit-scrollbar { display: none; }
        .phone.small { width: 300px; min-height: 640px; }

        .card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
        }
        .section-label {
            font-size: 11px; font-weight: 700; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: left;
        }

        /* Stress meter */
        .meter-track {
            height: 10px; border-radius: 5px;
            background: rgba(255,255,255,0.08);
            overflow: hidden; margin: 8px 0;
        }
        .meter-fill {
            height: 100%; border-radius: 5px;
            transition: width 0.8s ease, background 0.8s ease;
        }

        /* Action buttons */
        .action-btn {
            flex: 1; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 14px 8px; border-radius: 12px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: center;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); }
        .action-btn.on { background: rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.3); }

        /* Journal entry */
        .journal-entry {
            display: flex; gap: 12px; padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
            text-align: left;
        }
        .journal-entry:last-child { border-bottom: none; }
        .journal-dot {
            width: 8px; height: 8px; border-radius: 50%;
            margin-top: 5px; flex-shrink: 0;
        }

        /* Carousel button */
        .carousel-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.25); cursor: pointer;
            font-size: 16px; padding: 12px; user-select: none;
        }
        .carousel-arrow:hover { color: rgba(255,255,255,0.5); }

        /* Label buttons for pattern review */
        .label-btn {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            text-align: left; display: flex; align-items: center; gap: 10px;
            transition: all 0.15s;
        }
        .label-btn:hover { filter: brightness(1.2); }

        /* Status card for caregiver */
        .status-card {
            text-align: center; padding: 32px 20px;
            border-radius: 20px;
        }

        @keyframes gentle-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(129,140,248,0.3); }
            50% { box-shadow: 0 0 40px rgba(129,140,248,0.6), 0 0 80px rgba(129,140,248,0.2); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            // --- STATE ---
            const [stressLevel, setStressLevel] = useState(28);
            const [activity, setActivity] = useState('🪑 Sitting Still');
            const [tier, setTier] = useState(0); // 0=calm, 1=early warning, 2=escalation
            const [watchView, setWatchView] = useState('anchor'); // anchor | glowing | carousel | success
            const [carouselIdx, setCarouselIdx] = useState(0);
            const [muted, setMuted] = useState(false);
            const [playing, setPlaying] = useState(false);
            const [messageSent, setMessageSent] = useState(false);

            const emotions = [
                { icon: '🌩️', label: 'Overwhelmed', bg: 'rgba(129,140,248,0.15)', border: 'rgba(129,140,248,0.4)', color: '#a5b4fc' },
                { icon: '✨', label: 'Excited', bg: 'rgba(251,191,36,0.12)', border: 'rgba(251,191,36,0.4)', color: '#fcd34d' },
                { icon: '🏃', label: 'Active', bg: 'rgba(148,163,184,0.12)', border: 'rgba(148,163,184,0.3)', color: '#cbd5e1' },
            ];

            const [journal, setJournal] = useState([
                { time: '2:15 PM – 2:40 PM', place: 'Safeway', activity: 'Pacing', label: '🌩️', labelText: 'Overwhelmed', color: '#a5b4fc' },
                { time: '11:30 AM – 11:45 AM', place: 'Home', activity: 'Still', label: '✨', labelText: 'Excited', color: '#fcd34d' },
            ]);

            const [reviewEvents, setReviewEvents] = useState([
                {
                    time: 'Yesterday, 4:10 PM – 4:35 PM',
                    cues: [
                        { icon: '📍', text: 'Shopping Mall Food Court' },
                        { icon: '🔊', text: 'Loud (78 dB)' },
                        { icon: '🔄', text: 'Pacing' },
                        { icon: '📅', text: 'Family Outing' },
                    ]
                }
            ]);

            // --- SIMULATE STRESS EVENT ---
            const simulateEvent = () => {
                setTier(1);
                setWatchView('glowing');
                setStressLevel(55);
                setActivity('🔄 Pacing');

                // Escalate to tier 2 after 4 seconds
                setTimeout(() => {
                    setTier(2);
                    setStressLevel(78);
                }, 4000);
            };

            // Animate stress level gently
            useEffect(() => {
                const iv = setInterval(() => {
                    setStressLevel(prev => {
                        if (tier === 0) return Math.max(15, Math.min(40, prev + (Math.random() * 6 - 3)));
                        if (tier === 1) return Math.max(45, Math.min(65, prev + (Math.random() * 8 - 3)));
                        return Math.max(65, Math.min(92, prev + (Math.random() * 10 - 4)));
                    });
                }, 1500);
                return () => clearInterval(iv);
            }, [tier]);

            const [selectedEmotion, setSelectedEmotion] = useState(null);

            const handleAnchorTap = () => {
                if (watchView === 'anchor') {
                    simulateEvent();
                } else if (watchView === 'glowing') {
                    setWatchView('carousel');
                }
            };

            const handleEmojiConfirm = () => {
                const emotion = emotions[carouselIdx];
                setSelectedEmotion(emotion);
                
                // If it's distress/overwhelmed, escalate
                if (emotion.label === 'Overwhelmed') {
                    setTier(2);
                    setStressLevel(85);
                }
                
                setWatchView('ongoing');
            };

            const handleEndEvent = () => {
                setWatchView('success');
                setTimeout(() => {
                    setWatchView('anchor');
                    setTier(0);
                    setStressLevel(30);
                    setActivity('🪑 Sitting Still');
                    setSelectedEmotion(null);
                }, 2000);
            };

            const handleResolve = () => {
                setReviewEvents(prev => prev.slice(1));
            };

            const meterColor = stressLevel < 40 ? '#34d399' : stressLevel < 65 ? '#fbbf24' : '#a78bfa';
            const meterLabel = stressLevel < 40 ? 'Low' : stressLevel < 65 ? 'Moderate' : 'High';

            // --- RENDER ---
            return (
                <div style={{ display: 'flex', gap: '48px', alignItems: 'flex-start', flexWrap: 'wrap', justifyContent: 'center' }}>

                    {/* ==================== WATCH ==================== */}
                    <div style={{ textAlign: 'center' }}>
                        <div style={{ color: '#64748b', fontSize: 13, fontWeight: 600, marginBottom: 20, letterSpacing: '0.5px' }}>
                            WATCH · Wearer
                        </div>
                        <div className="watch">
                            {watchView === 'anchor' && (
                                <button className="anchor-btn" onClick={handleAnchorTap}>
                                    <div className="anchor-dot"></div>
                                </button>
                            )}

                            {watchView === 'glowing' && (
                                <button
                                    className="anchor-btn glowing"
                                    onClick={handleAnchorTap}
                                    style={{ animation: 'gentle-glow 3s ease-in-out infinite' }}
                                >
                                    <div className="anchor-dot"></div>
                                </button>
                            )}

                            {watchView === 'carousel' && (
                                <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', position: 'relative' }}>
                                    <div className="carousel-arrow" style={{ left: 6 }}
                                         onClick={() => setCarouselIdx(p => p > 0 ? p - 1 : emotions.length - 1)}>◀</div>

                                    <div style={{ textAlign: 'center', cursor: 'pointer' }} onClick={handleEmojiConfirm}>
                                        <div style={{ fontSize: 52, marginBottom: 6 }}>{emotions[carouselIdx].icon}</div>
                                        <div style={{ fontSize: 13, fontWeight: 700, color: emotions[carouselIdx].color }}>
                                            {emotions[carouselIdx].label}
                                        </div>
                                    </div>

                                    <div className="carousel-arrow" style={{ right: 6 }}
                                         onClick={() => setCarouselIdx(p => p < emotions.length - 1 ? p + 1 : 0)}>▶</div>

                                    <div style={{ position: 'absolute', bottom: 18, display: 'flex', gap: 5 }}>
                                        {emotions.map((_, i) => (
                                            <div key={i} style={{ width: 6, height: 6, borderRadius: '50%', background: i === carouselIdx ? '#fff' : 'rgba(255,255,255,0.2)' }} />
                                        ))}
                                    </div>
                                </div>
                            )}

                            {watchView === 'ongoing' && selectedEmotion && (
                                <div style={{ width: '100%', height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center' }}>
                                    <div style={{ fontSize: 42, marginBottom: 8, animation: 'gentle-glow 3s ease-in-out infinite' }}>
                                        {selectedEmotion.icon}
                                    </div>
                                    <div style={{ fontSize: 13, fontWeight: 700, color: selectedEmotion.color, marginBottom: 12 }}>
                                        Event Active
                                    </div>
                                    <button 
                                        onClick={handleEndEvent}
                                        style={{
                                            background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)',
                                            color: '#fff', padding: '6px 12px', borderRadius: '14px', fontSize: 11,
                                            fontWeight: 600, cursor: 'pointer'
                                        }}
                                    >
                                        I'm OK Now
                                    </button>
                                </div>
                            )}

                            {watchView === 'success' && (
                                <div style={{ textAlign: 'center' }}>
                                    <div style={{ fontSize: 48 }}>✅</div>
                                    <div style={{ fontSize: 14, fontWeight: 700, color: '#34d399', marginTop: 8 }}>Ended</div>
                                </div>
                            )}
                        </div>
                        <div style={{ color: '#475569', fontSize: 11, marginTop: 14, maxWidth: 200, lineHeight: 1.4 }}>
                            {watchView === 'anchor' && 'Tap the button to simulate a stress event'}
                            {watchView === 'glowing' && 'Gentle glow = early warning. Tap to check in.'}
                            {watchView === 'carousel' && 'Swipe to pick how you feel. Tap to confirm.'}
                            {watchView === 'ongoing' && 'Event is ongoing. Caregiver is notified. Tap "I\'m OK Now" to end it.'}
                            {watchView === 'success' && 'Logged! Fading back to calm...'}
                        </div>
                    </div>

                    {/* ==================== WEARER PHONE ==================== */}
                    <div style={{ textAlign: 'center' }}>
                        <div style={{ color: '#64748b', fontSize: 13, fontWeight: 600, marginBottom: 20, letterSpacing: '0.5px' }}>
                            PHONE · Wearer Mode
                        </div>
                        <div className="phone">
                            <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 20 }}>BioCue</div>

                            {/* Current State */}
                            <div className="card">
                                <div className="section-label">How your body is right now</div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                                    <span style={{ fontSize: 15, fontWeight: 700 }}>Stress Level</span>
                                    <span style={{ fontSize: 15, fontWeight: 700, color: meterColor }}>{meterLabel}</span>
                                </div>
                                <div className="meter-track">
                                    <div className="meter-fill" style={{ width: `${stressLevel}%`, background: meterColor }} />
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text-dim)', marginBottom: 16 }}>
                                    <span>Calm</span><span>Elevated</span><span>High</span>
                                </div>

                                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                    <span style={{ fontSize: 11, color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Activity:</span>
                                    <span style={{ fontSize: 14, fontWeight: 600 }}>{activity}</span>
                                </div>

                                {tier >= 1 && (
                                    <div style={{ marginTop: 14, padding: '10px 14px', borderRadius: 10,
                                        background: tier === 2 ? 'rgba(129,140,248,0.12)' : 'rgba(251,191,36,0.1)',
                                        border: `1px solid ${tier === 2 ? 'rgba(129,140,248,0.3)' : 'rgba(251,191,36,0.2)'}`,
                                        fontSize: 13, color: tier === 2 ? '#c4b5fd' : '#fcd34d'
                                    }}>
                                        {tier === 1 ? '⚡ Your body stress is rising. Take a moment if you need it.' : '💜 Stress has been elevated for a few minutes. Your caregiver has been notified.'}
                                    </div>
                                )}
                            </div>

                            {/* Quick Actions */}
                            <div className="card">
                                <div className="section-label">Quick Actions</div>
                                <div style={{ display: 'flex', gap: 10, marginBottom: 10 }}>
                                    <button className={`action-btn ${muted ? 'on' : ''}`} onClick={() => setMuted(!muted)}>
                                        {muted ? '✓ Phone Muted' : '🔇 Mute Phone'}
                                    </button>
                                    <button className={`action-btn ${playing ? 'on' : ''}`} onClick={() => setPlaying(!playing)}>
                                        {playing ? '✓ Playing' : '🎵 Calm Audio'}
                                    </button>
                                </div>
                                <button
                                    className={`action-btn ${messageSent ? 'on' : ''}`}
                                    style={{ width: '100%' }}
                                    onClick={() => { setMessageSent(true); setTimeout(() => setMessageSent(false), 3000); }}
                                >
                                    {messageSent ? '✓ Message Sent' : '💬 Message Caregiver'}
                                </button>
                            </div>

                            {/* Journal */}
                            <div className="card">
                                <div className="section-label">Today's Journal</div>
                                {journal.map((e, i) => (
                                    <div className="journal-entry" key={i}>
                                        <div className="journal-dot" style={{ background: e.color }} />
                                        <div>
                                            <div style={{ fontWeight: 600, fontSize: 13 }}>{e.time}</div>
                                            <div style={{ color: 'var(--text-dim)', fontSize: 12, marginTop: 2 }}>
                                                {e.place} · {e.activity}
                                            </div>
                                            <div style={{ marginTop: 4, fontSize: 13 }}>
                                                <span>{e.label}</span> <span style={{ color: e.color }}>{e.labelText}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {journal.length === 0 && (
                                    <div style={{ color: 'var(--text-dim)', fontSize: 13, textAlign: 'center', padding: 20 }}>
                                        No events today. All calm ✨
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* ==================== CAREGIVER PHONE ==================== */}
                    <div style={{ textAlign: 'center' }}>
                        <div style={{ color: '#64748b', fontSize: 13, fontWeight: 600, marginBottom: 20, letterSpacing: '0.5px' }}>
                            PHONE · Caregiver Mode
                        </div>
                        <div className="phone small">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                                <span style={{ fontSize: 20, fontWeight: 700 }}>BioCue</span>
                                <span style={{ fontSize: 11, color: 'var(--text-dim)', background: 'rgba(255,255,255,0.05)', padding: '4px 10px', borderRadius: 12 }}>Caregiver</span>
                            </div>

                            {/* Status Card */}
                            <div className="status-card" style={{
                                background: tier >= 2
                                    ? 'linear-gradient(135deg, rgba(129,140,248,0.15), rgba(109,40,217,0.1))'
                                    : 'linear-gradient(135deg, rgba(52,211,153,0.1), rgba(56,189,248,0.05))',
                                border: `1px solid ${tier >= 2 ? 'rgba(129,140,248,0.3)' : 'rgba(52,211,153,0.15)'}`,
                                marginBottom: 14, borderRadius: 20
                            }}>
                                <div style={{ fontSize: 48, marginBottom: 12 }}>
                                    {tier >= 2 ? '🌩️' : '✨'}
                                </div>
                                <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 6 }}>
                                    {tier >= 2 ? 'Alex may need support' : 'Alex is doing fine'}
                                </div>
                                <div style={{ fontSize: 13, color: 'var(--text-dim)', lineHeight: 1.5 }}>
                                    {tier >= 2
                                        ? 'Stress has been elevated for a few minutes. Pacing detected at current location.'
                                        : 'No elevated stress detected. Sitting still at home.'}
                                </div>
                            </div>

                            {/* Current State (Caregiver View) */}
                            <div className="card">
                                <div className="section-label">Current State</div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                                    <span style={{ fontSize: 13, fontWeight: 700 }}>Stress Level</span>
                                    <span style={{ fontSize: 13, fontWeight: 700, color: meterColor }}>{meterLabel}</span>
                                </div>
                                <div className="meter-track">
                                    <div className="meter-fill" style={{ width: `${stressLevel}%`, background: meterColor }} />
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 12 }}>
                                    <span style={{ fontSize: 11, color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>Activity:</span>
                                    <span style={{ fontSize: 13, fontWeight: 600 }}>{activity}</span>
                                </div>
                            </div>

                            {/* Tier 2 notification preview */}
                            {tier >= 2 && (
                                <div className="card" style={{ background: 'rgba(129,140,248,0.08)', border: '1px solid rgba(129,140,248,0.2)' }}>
                                    <div style={{ fontSize: 12, fontWeight: 700, color: '#a5b4fc', marginBottom: 6 }}>PUSH NOTIFICATION</div>
                                    <div style={{ fontSize: 13, lineHeight: 1.5 }}>
                                        Alex's stress has been elevated for 5 minutes. They may need support.
                                    </div>
                                </div>
                            )}

                            {/* Pattern Review */}
                            <div className="card">
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                                    <div className="section-label" style={{ marginBottom: 0 }}>Pattern Review</div>
                                    {reviewEvents.length > 0 && (
                                        <span style={{ background: 'var(--accent)', color: 'white', padding: '2px 8px', borderRadius: 10, fontSize: 10, fontWeight: 700 }}>
                                            {reviewEvents.length}
                                        </span>
                                    )}
                                </div>

                                {reviewEvents.length > 0 ? (
                                    <div>
                                        <div style={{ fontSize: 13, lineHeight: 1.5, marginBottom: 12 }}>
                                            A stress spike was detected but Alex didn't label it on the watch.
                                        </div>
                                        <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 12 }}>
                                            {reviewEvents[0].time}
                                        </div>

                                        {/* Context Cues */}
                                        <div style={{ background: 'rgba(0,0,0,0.2)', padding: 12, borderRadius: 10, marginBottom: 14 }}>
                                            <div style={{ fontSize: 10, color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: 8 }}>
                                                Context Cues
                                            </div>
                                            {reviewEvents[0].cues.map((c, i) => (
                                                <div key={i} style={{ fontSize: 13, color: '#cbd5e1', display: 'flex', gap: 8, marginBottom: 4 }}>
                                                    <span>{c.icon}</span><span>{c.text}</span>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Nudge */}
                                        <div style={{ fontSize: 12, color: '#fbbf24', marginBottom: 14, fontStyle: 'italic' }}>
                                            💡 Ask Alex first if you can — they may remember what happened.
                                        </div>

                                        {/* Label buttons */}
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                            {emotions.map((e, i) => (
                                                <button key={i} className="label-btn" onClick={handleResolve}
                                                    style={{ background: e.bg, border: `1px solid ${e.border}`, color: e.color }}>
                                                    <span style={{ fontSize: 18 }}>{e.icon}</span> {e.label}
                                                </button>
                                            ))}
                                            <button className="label-btn" onClick={handleResolve}
                                                style={{ background: 'rgba(148,163,184,0.08)', border: '1px solid rgba(148,163,184,0.2)', color: '#94a3b8' }}>
                                                <span style={{ fontSize: 18 }}>🤷</span> Unsure / Wasn't Present
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{ textAlign: 'center', padding: '20px 0' }}>
                                        <div style={{ fontSize: 24, marginBottom: 6 }}>✨</div>
                                        <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--calm)' }}>All caught up</div>
                                        <div style={{ fontSize: 12, color: 'var(--text-dim)', marginTop: 4 }}>
                                            BioCue is learning Alex's patterns.
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Journal (Caregiver View) */}
                            <div className="card">
                                <div className="section-label">Today's Journal</div>
                                {journal.map((e, i) => (
                                    <div className="journal-entry" key={i}>
                                        <div className="journal-dot" style={{ background: e.color }} />
                                        <div>
                                            <div style={{ fontWeight: 600, fontSize: 13 }}>{e.time}</div>
                                            <div style={{ color: 'var(--text-dim)', fontSize: 12, marginTop: 2 }}>
                                                {e.place} · {e.activity}
                                            </div>
                                            <div style={{ marginTop: 4, fontSize: 13 }}>
                                                <span>{e.label}</span> <span style={{ color: e.color }}>{e.labelText}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {journal.length === 0 && (
                                    <div style={{ color: 'var(--text-dim)', fontSize: 13, textAlign: 'center', padding: 20 }}>
                                        No events today. All calm ✨
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
