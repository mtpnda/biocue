full_description: |
  BioCue is an ambient wellness and habit-cueing companion designed to seamlessly bridge the gap between smartwatch vitals and caregiver support. Built with neuro-inclusive design principles, BioCue provides a zero-anxiety tracking experience for the wearer while delivering rich, real-time wellness insights to a trusted caregiver or family circle.
  
  Using Wear OS sensor integration, BioCue monitors continuous wellness data directly from your smartwatch and instantly syncs it to a clear, calming dashboard on your companion phone.
  
  KEY FEATURES
  • Zero-Anxiety Watch Interface: A calming, ambient smartwatch design that operates quietly in the background without overwhelming the wearer with clinical numbers.
  • Caregiver Dashboard: A clear mobile interface displaying real-time heart rate trends and activity levels.
  • The Fusion Score: An intelligent wellness index that synthesizes biometric vitals to highlight rising stress patterns, enabling wearers and caregivers to practice timely grounding and awareness routines.
  • Real-Time Sync: Powered by a high-speed data layer, ensuring the caregiver's dashboard updates immediately when wellness vitals change.
  • Retrospective Labeling: Review historical events and track baseline calibrations over time to identify daily stress triggers and habit patterns.
  • Private Circle Sharing: Invite trusted family members or caregivers to your private circle via secure pairing codes.
  
  IMPORTANT MEDICAL & HEALTH DISCLAIMER
  • Not a Medical Device: BioCue is NOT a medical device, is not approved or certified by any medical regulatory authority (such as the US FDA or EU CE MDR), and is not clinical software.
  • For General Wellness Only: BioCue is intended solely for general health, fitness, habit awareness, relaxation, and stress management. It does NOT diagnose, treat, cure, mitigate, or prevent any disease, illness, psychological disorder, or medical condition.
  • Not a Substitute for Professional Advice: BioCue should never replace professional medical diagnosis, clinical judgment, or medical care. Always seek the advice of a physician or qualified healthcare provider with any questions regarding health conditions, symptoms, or interventions. If you experience severe distress or a medical emergency, contact emergency medical services immediately.
  
  DATA PRIVACY & SECURITY
  • Private by Design: Raw biometric and motion data stays protected and is only shared with caregivers you explicitly authorize.
  • No Data Selling: We do not sell your personal or wellness data to advertisers or third-party data brokers.
  • Transparent Controls: You remain in complete control of your caregiver pairing and data retention at all times.
  
  OFFICIAL LINKS & SUPPORT
  • Official Website: https://biocue.matapandastudio.deno.net
  • Privacy Policy: https://biocue.matapandastudio.deno.net/privacy
  • Help & Support: https://biocue.matapandastudio.deno.net/support
  • Terms of Service: https://biocue.matapandastudio.deno.net/terms
  
  REQUIREMENTS
  • BioCue requires both an Android smartphone (Android 10+) and a compatible Wear OS smartwatch (Wear OS 3.0+) for full companion syncing.
