# Generate the Xcode project: brew install xcodegen && xcodegen generate && open BioCue.xcodeproj
name: BioCue
options:
  bundleIdPrefix: com.mtpnda
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  BioCueCore:
    path: Packages/BioCueCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BioCue:
    type: application
    platform: iOS
    sources:
      - path: BioCue/Sources
      - path: BioCue/Resources
    dependencies:
      - package: BioCueCore
    info:
      path: BioCue/Info.plist
      properties:
        CFBundleDisplayName: BioCue
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Keeps the Bluetooth link to the watch alive, and lets iOS relaunch the app to deliver data.
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: "BioCue uses Bluetooth to receive stress readings from your watch. Readings stay on this phone."
        UIAppFonts: [Newsreader.ttf, AtkinsonHyperlegibleNext.ttf]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - biocue
              - com.googleusercontent.apps.1006317660514-e5ucehed56l4qdh34r97mg8s1smb05e7
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtpnda.biocue.ios
        DEVELOPMENT_TEAM: 3T5F877TAB
        CODE_SIGN_STYLE: Automatic

  BioCueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BioCueTests
    dependencies:
      - target: BioCue
      - package: BioCueCore
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BioCue.app/BioCue"

schemes:
  BioCue:
    build:
      targets: { BioCue: all, BioCueTests: [test] }
    test:
      targets: [BioCueTests]
